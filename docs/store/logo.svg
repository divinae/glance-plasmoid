<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Glance: a vertical panel with its pills, and the drawer sliding out of it -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fb3f6"/>
      <stop offset="1" stop-color="#5b4bd6"/>
    </linearGradient>
    <linearGradient id="drawer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#eef3ff" stop-opacity="0.90"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b1446" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- the panel -->
  <rect x="34" y="40" width="30" height="176" rx="15" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="41" y="62" width="16" height="34" rx="8" fill="#b06ff0"/>
  <rect x="41" y="102" width="16" height="26" rx="8" fill="#4fb3f6"/>
  <rect x="41" y="134" width="16" height="20" rx="8" fill="#f2a23a"/>
  <!-- the drawer, out of it -->
  <g filter="url(#shadow)">
    <rect x="76" y="58" width="146" height="140" rx="24" fill="url(#drawer)"/>
  </g>
  <rect x="90" y="72" width="54" height="54" rx="12" fill="#4fb3f6" fill-opacity="0.85"/>
  <rect x="152" y="72" width="56" height="24" rx="10" fill="#5b4bd6" fill-opacity="0.22"/>
  <rect x="152" y="102" width="56" height="24" rx="10" fill="#5b4bd6" fill-opacity="0.22"/>
  <rect x="90" y="134" width="118" height="50" rx="12" fill="#f2a23a" fill-opacity="0.85"/>
  <circle cx="117" cy="99" r="12" fill="#ffffff" fill-opacity="0.9"/>
</svg>
